appId: md.clipboard.app
productName: clipboard.md
directories:
  output: dist
# No auto-update feed. Without this, electron-builder infers a GitHub provider from
# the git remote, tries to write autoupdate metadata beside the deb, and fails the
# whole build with "GitHub Personal Access Token is not set" — after the artifacts
# have already been produced, so `pnpm build:linux` exits 1 on a successful build.
publish: null
files:
  - out/**
  - package.json
  # Prune ~600MB of binaries we never execute. Each exclusion is deliberate:
  #  - onnxruntime ships CUDA/TensorRT providers (~330MB); embeddings run on CPU
  #  - onnxruntime bundles every platform's binaries; keep this build's only. The
  #    "keep this build's" part is done per-platform under mac:/linux: below — this
  #    list is shared by every target, so pruning a named platform here prunes it
  #    from that platform's OWN build. It excluded darwin unconditionally, which
  #    deleted the binding the mac app needs: verified, the packaged app logged
  #    "Cannot find module '../bin/napi-v6/darwin/arm64/onnxruntime_binding.node'"
  #    and stored zero embeddings while dev worked fine.
  #  - the Codex and Claude Agent SDK native CLIs are large and only used by the
  #    subscription lanes, which fall back to the API lane when absent (they are
  #    re-added per-platform below for the platform being built)
  - '!**/node_modules/onnxruntime-node/bin/napi-v6/*/*/libonnxruntime_providers_cuda.so'
  - '!**/node_modules/onnxruntime-node/bin/napi-v6/*/*/libonnxruntime_providers_tensorrt.so'
  - '!**/node_modules/onnxruntime-node/bin/napi-v6/*/*/libonnxruntime_providers_shared.so'
  - '!**/node_modules/tesseract.js-core/*simd*'
  - '!**/node_modules/@img/sharp-libvips-*/lib/*.a'
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/sqlite-vec*/**'
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
  - '**/node_modules/onnxruntime-node/**'
  - '**/node_modules/tesseract.js*/**'
  - '**/node_modules/@anthropic-ai/claude-agent-sdk/**'
  # The subscription lanes SPAWN these CLIs. A path inside app.asar is a path into a
  # file, so spawn fails with ENOTDIR — observed for both lanes in the packaged build
  # while dev worked fine. See modelport/nativeCli.ts.
  - '**/node_modules/@anthropic-ai/claude-agent-sdk-*/**'
  - '**/node_modules/@openai/codex-sdk/**'
  - '**/node_modules/@openai/codex-*/**'
  # The glob above never matched: pnpm's real directory is node_modules/@openai/codex
  # (no suffix), and `codex-*` requires one. So the CLI the codex lane spawns was
  # still inside app.asar in every packaged build on every platform — a pre-existing
  # all-platform bug, fixed here because the Windows port is what made it visible.
  - '**/node_modules/@openai/codex/**'
  # sherpa-onnx loads its .node addon and dylibs by path at runtime; from inside
  # app.asar those paths don't exist, which is exactly how sqlite-vec silently
  # disabled semantic search in the installed build only.
  - '**/node_modules/sherpa-onnx*/**'

linux:
  # Keep only this platform's onnxruntime binding (~110MB per platform).
  #
  # The two positive patterns are REQUIRED and must match the top-level `files`.
  # A platform `files:` list containing nothing but negations makes electron-builder
  # fall back to the default `**/*`, which silently discards the top-level allowlist:
  # the whole repo then ships inside app.asar — src/, DESIGN.md, and any stray file
  # sitting in the working tree. Verified by A/B build: with a negation-only list the
  # asar held 104 src/ entries; with these two lines restored it holds only
  # node_modules, out and package.json.
  files:
    - out/**
    - package.json
    - '!**/node_modules/onnxruntime-node/bin/napi-v6/{darwin,win32}/**'
  # The bridge plugin scaffold, same as mac below. Without this the Linux package has
  # no scaffold at all and agent sessions come up with tools but no channel — it only
  # appeared to work while the allowlist bug was shipping the entire repo.
  extraResources:
    - from: resources/plugin
      to: plugin
  syncDesktopName: true
  target:
    - AppImage
    - deb
  category: Utility
  synopsis: Local-first AI clipboard manager
  desktop:
    entry:
      # Must match the WM_CLASS Electron reports, or the shell won't associate the
      # running window with this launcher entry (wrong icon, no grouping).
      StartupWMClass: clipboard-md

deb:
  afterInstall: null

win:
  # The two positive patterns are REQUIRED, exactly as in linux: and mac: above. A
  # platform files: list of nothing but negations makes electron-builder fall back to
  # `**/*` and silently discard the top-level allowlist — the asar then holds the
  # whole working tree. scripts/verify-package.mjs asserts this did not happen.
  files:
    - out/**
    - package.json
    - '!**/node_modules/onnxruntime-node/bin/napi-v6/{darwin,linux}/**'
    # DirectML is onnxruntime's Windows GPU provider (~38MB). The embedding worker
    # pins provider 'cpu', so this is pure download weight that can never execute.
    - '!**/node_modules/onnxruntime-node/bin/napi-v6/win32/*/DirectML.dll'
    - '!**/node_modules/onnxruntime-node/bin/napi-v6/win32/*/dxcompiler.dll'
    - '!**/node_modules/onnxruntime-node/bin/napi-v6/win32/*/dxil.dll'
  # Same reason as linux/mac: claude spawns the bridge by PATH, and a path inside
  # app.asar is a path into a file. Omitting this is the verbatim repeat of the Linux
  # regression where agent sessions came up with tools and no channel.
  extraResources:
    - from: resources/plugin
      to: plugin
  # NOT build/icon.png: electron-builder auto-detects that name for linux and mac
  # too, which would change those artifacts' icons. This port must not touch them.
  icon: build/icon-win.png
  target:
    - nsis

nsis:
  # The clipboard history, the settings and the learned dictation corrections live in
  # %APPDATA%. Deleting them on uninstall would make "reinstall to fix it" — the first
  # thing anyone tries on Windows — destroy everything the app was for.
  deleteAppDataOnUninstall: false
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

mac:
  # Keep only this platform's onnxruntime binding — see the note in `files` above.
  # The positive patterns are load-bearing for the same reason as linux's.
  files:
    - out/**
    - package.json
    - '!**/node_modules/onnxruntime-node/bin/napi-v6/{linux,win32}/**'
  target:
    - dmg
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Dictation in the scratchpad records audio to transcribe it.
    NSAppleEventsUsageDescription: Used to paste into the previously focused app.
    # The rewrite hotkey reads the current selection through the accessibility API.
    NSAccessibilityUsageDescription: Used to read the text you have selected so it can be rewritten, and to paste into the app you were using.
    # Interactive screenshot capture goes through `screencapture`, which is gated by
    # Screen Recording on modern macOS.
    NSScreenCaptureUsageDescription: Used to capture a region of the screen into your clipboard history.
    # Background app: no Dock icon, no ⌘-Tab entry. Set here as well as via
    # app.dock.hide() so the icon never appears at all, not even during launch.
    LSUIElement: true
  extraResources:
    # paste.ts looks for this at <resourcesPath>/clipmd-helper. It must stay
    # executable — asar would strip that, and it is a binary, not app code.
    - from: resources/mac/clipmd-helper
      to: clipmd-helper
    # The bridge plugin scaffold. Copied out to userData at startup, because claude
    # spawns the bridge by path and a path inside app.asar is a path into a file.
    - from: resources/plugin
      to: plugin
  # Unsigned by default so anyone can build without a certificate.
  #
  # The cost is real during development: an unsigned bundle keeps only the linker's
  # ad-hoc signature (Identifier=Electron, no stable Designated Requirement), and TCC
  # keys Accessibility on the code identity. Every rebuild therefore invalidates the
  # grant — System Settings still shows the toggle ON while the app sees "not
  # granted", which looks exactly like a bug in the app.
  #
  # To make the grant stick, build signed with any real identity (an Apple
  # Development cert is enough — this is not about distribution):
  #   security find-identity -v -p codesigning
  #   CLIPMD_SIGN_IDENTITY="Apple Development: …" pnpm build:mac:signed
  # Notarized direct distribution additionally needs a Developer ID Application cert.
  identity: null

npmRebuild: true
